<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digit Recognizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }
    h1 { font-size: 1.8rem; letter-spacing: 1px; }
    canvas {
      border: 2px solid #444;
      border-radius: 12px;
      cursor: crosshair;
      background: #000;
    }
    .buttons { display: flex; gap: 12px; }
    button {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    #predictBtn { background: #4f46e5; color: #fff; }
    #clearBtn { background: #333; color: #ccc; }
    #result {
      font-size: 5rem;
      font-weight: 800;
      color: #a5b4fc;
      min-height: 80px;
    }
    #confidence { color: #888; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Handwritten Digit Recognition</h1>
  <canvas id="canvas" width="280" height="280"></canvas>
  <div class="buttons">
    <button id="predictBtn">Predict</button>
    <button id="clearBtn">Clear</button>
  </div>
  <div id="result">?</div>
  <div id="confidence"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', (e) => { if (!drawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mouseleave', () => drawing = false);

    // Touch support
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; const t = e.touches[0]; const r = canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(t.clientX - r.left, t.clientY - r.top); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!drawing) return; const t = e.touches[0]; const r = canvas.getBoundingClientRect(); ctx.lineTo(t.clientX - r.left, t.clientY - r.top); ctx.stroke(); });
    canvas.addEventListener('touchend', () => drawing = false);

    document.getElementById('clearBtn').onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('result').textContent = '?';
      document.getElementById('confidence').textContent = '';
    };

    document.getElementById('predictBtn').onclick = async () => {
      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('file', blob, 'digit.png');
        try {
          const res = await fetch('http://localhost:8000/predict', { method: 'POST', body: formData });
          const data = await res.json();
          document.getElementById('result').textContent = data.digit;
          document.getElementById('confidence').textContent = `Confidence: ${data.confidence}%`;
        } catch {
          document.getElementById('result').textContent = '!';
          document.getElementById('confidence').textContent = 'API not reachable';
        }
      }, 'image/png');
    };
  </script>
</body>
</html>
